name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup set profile minimal
          rustup default 1.89.0
          rustup component add rustfmt

      - name: Install Solana CLI + build SBF programs
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v4.3.0/install)"
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          cargo-build-sbf --version
          cargo-build-sbf --manifest-path programs/rampart/Cargo.toml
          cargo-build-sbf --manifest-path programs/oracle-mock/Cargo.toml

      - name: Run litesvm tests
        run: cargo test -p rampart

      - name: Assemble release assets
        run: |
          mkdir -p dist
          cp target/deploy/rampart.so dist/rampart.so
          cp target/deploy/oracle_mock.so dist/oracle_mock.so
          cp client/idl/rampart.json dist/rampart.json
          cp client/idl/oracle-mock.json dist/oracle-mock.json
          sudo apt-get update -qq && sudo apt-get install -y -qq zip >/dev/null
          cd dist && zip -q rampart-${GITHUB_REF_NAME}.zip rampart.so oracle_mock.so rampart.json oracle-mock.json
          cd ..
          (cd dist && sha256sum * > CHECKSUMS.txt)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/rampart.so \
            dist/oracle_mock.so \
            dist/rampart.json \
            dist/oracle-mock.json \
            dist/rampart-${GITHUB_REF_NAME}.zip \
            dist/CHECKSUMS.txt \
            --title "Rampart ${GITHUB_REF_NAME}" \
            --notes "On-chain policy vaults for trading agents. Build: solana 4.3.0 / anchor 1.2.0. See README for the devnet demo + host guide." \
            --repo ${{ github.repository }}