[package]
name = "rampart"
version = "0.1.0"
description = "Created with Anchor"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "rampart"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = "1.2.0"
# Pinned to an exact rev. Without `rev`/`tag`, every build resolves whatever
# Meteora's default branch points at, so an upstream push can change the
# program we compile -- or break the build -- with no change in this repo. The
# DBC zero-copy account layouts (VirtualPool, PoolConfig) are deserialized
# straight out of account data, so that revision is a security boundary, not
# just a build detail. Bump it deliberately, with a test run.
dynamic-bonding-curve = { git = "https://github.com/MeteoraAg/dynamic-bonding-curve", rev = "f552f20aa3c1c7631427c3827aeea7c58b902813", features = ["cpi"] }
dynamic-bonding-curve-sdk = { git = "https://github.com/MeteoraAg/dynamic-bonding-curve", rev = "f552f20aa3c1c7631427c3827aeea7c58b902813" }
# Pinned: a transitive dep of dynamic-bonding-curve. Versions >= 1.18.0 require
# rustc 1.90, but CI (and rust-toolchain.toml) is pinned to 1.89.0. 1.17.2 is
# the latest version that still supports 1.89.0 and satisfies Meteora's own
# `ruint = "1.14.0"` requirement.
ruint = "=1.17.2"

[dev-dependencies]
litesvm = "0.10.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
solana-account = "3.2.0"
solana-instruction = "3.0.0"
solana-transaction-error = "3.0.0"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
